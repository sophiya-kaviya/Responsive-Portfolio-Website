<!DOCTYPE html>
<html>
<head>
<title>Responsive Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<header>
    <h1>My Portfolio</h1>
    <p>Advanced CSS3 & Responsive Architecture</p>
</header>

<div class="container">

    <div class="card">
        <h2>HTML</h2>
        <p>Website Structure</p>
    </div>

    <div class="card">
        <h2>CSS3</h2>
        <p>Modern Styling</p>
    </div>

    <div class="card">
        <h2>Responsive Design</h2>
        <p>Mobile Friendly Layout</p>
    </div>

</div>

<footer>
    Home | Projects | Contact
</footer>

</body>
</html>
